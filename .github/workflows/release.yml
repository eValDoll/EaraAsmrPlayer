name: Issue 381 Hotfix

on:
  push:
    tags:
      - "test-1.2.5.1-issue-381-r2"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Enable Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
      - name: Prepare release signing keystore
        shell: bash
        env:
          EARA_RELEASE_JKS_BASE64: ${{ secrets.EARA_RELEASE_JKS_BASE64 }}
          EARA_RELEASE_STORE_PASSWORD: ${{ secrets.EARA_RELEASE_STORE_PASSWORD }}
          EARA_RELEASE_KEY_ALIAS: ${{ secrets.EARA_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${EARA_RELEASE_JKS_BASE64}" ]; then
            echo "Missing EARA_RELEASE_JKS_BASE64 secret"
            exit 1
          fi
          printf '%s' "${EARA_RELEASE_JKS_BASE64}" | base64 --decode > eara-release.jks
          chmod 600 eara-release.jks
          certificate="$(keytool -list -v -keystore eara-release.jks -storepass:env EARA_RELEASE_STORE_PASSWORD -alias "$EARA_RELEASE_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          echo "Keystore certificate SHA-256: $certificate"
          if [ "$certificate" != "4858dd7674fb4cf871441cf57648823f3af159634e0504523736ea93603a168a" ]; then
            echo "Release keystore does not match the published v1.2.5.1 APK"
            exit 1
          fi
      - name: Check API compatibility and run release unit tests
        run: ./gradlew :app:lintVitalRelease :app:testReleaseUnitTest
      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease
        env:
          EARA_RELEASE_STORE_FILE: eara-release.jks
          EARA_RELEASE_STORE_PASSWORD: ${{ secrets.EARA_RELEASE_STORE_PASSWORD }}
          EARA_RELEASE_KEY_ALIAS: ${{ secrets.EARA_RELEASE_KEY_ALIAS }}
          EARA_RELEASE_KEY_PASSWORD: ${{ secrets.EARA_RELEASE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: issue-381-signed-candidate
          retention-days: 7
          include-hidden-files: true
          path: |
            .build_asmr_player_android/app/outputs/apk/release/*.apk
            .build_asmr_player_android/app/outputs/mapping/release/mapping.txt
      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t APK_PATHS < <(find . -type f -path '*/outputs/apk/release/*.apk' -name '*.apk' | sort)
          if [ "${#APK_PATHS[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#APK_PATHS[@]}"
            find . -maxdepth 4 -type d -name outputs -print
            printf '%s\n' "${APK_PATHS[@]}"
            exit 1
          fi

          apk="${APK_PATHS[0]}"
          max_apk_bytes=$((20 * 1024 * 1024))
          apk_bytes="$(stat -c '%s' "$apk")"
          if [ "$apk_bytes" -gt "$max_apk_bytes" ]; then
            echo "Release APK is too large: $apk_bytes bytes (limit: $max_apk_bytes)"
            exit 1
          fi
          if unzip -Z1 "$apk" | grep -Ei '^lib/[^/]+/lib(onnxruntime|sherpa-onnx).*\.so$'; then
            echo "Release APK must not contain the on-demand sherpa-onnx runtime"
            exit 1
          fi

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          certificate="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]')"
          echo "APK certificate SHA-256: $certificate"
          if [ "$certificate" != "4858dd7674fb4cf871441cf57648823f3af159634e0504523736ea93603a168a" ]; then
            echo "Signing certificate does not match the published v1.2.5.1 APK"
            exit 1
          fi

          target="AsmrPlayer-${{ github.ref_name }}-universal.apk"
          echo "Copying $apk -> dist/$target"
          cp "$apk" "dist/$target"
          ls -lh dist
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: "1.2.5.1 搜索闪退临时修复"
          tag_name: ${{ github.ref_name }}
          prerelease: true
          make_latest: "false"
          body: |
            基于正式版 v1.2.5.1，仅加入 #381 的搜索缓存兼容修复。

            修复旧搜索缓存导致启动数秒后或进入在线搜索时闪退的问题。

            - 版本：1.2.5.1-hotfix（versionCode 10207）。
            - 使用与正式版 v1.2.5.1 相同的签名，可直接覆盖安装并保留数据。
            - 此版本为 Pre-release，不进入应用自动更新检查；请手动下载 APK 安装。
          overwrite: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}
