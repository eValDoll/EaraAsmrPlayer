name: Quality

on:
  pull_request:
  push:
    branches:
      - "release/**"
      - "update/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Run release unit tests
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-unit-test-reports
          include-hidden-files: true
          path: |
            .build_asmr_player_android/app/reports/tests/testReleaseUnitTest/
            .build_asmr_player_android/app/test-results/testReleaseUnitTest/
