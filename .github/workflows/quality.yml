name: Quality

on:
  workflow_dispatch:
    inputs:
      signed_apk:
        description: Build a signed APK for device verification
        type: boolean
        default: false
      verification_variant:
        description: APK variant for device verification
        type: choice
        options:
          - release
          - benchmark
        default: release
  pull_request:
  push:
    branches:
      - "release/**"
      - "update/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}-${{ inputs.signed_apk || false }}
  cancel-in-progress: true

jobs:
  release-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Run release unit tests
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-unit-test-reports
          include-hidden-files: true
          path: |
            .build_asmr_player_android/app/reports/tests/testReleaseUnitTest/
            .build_asmr_player_android/app/test-results/testReleaseUnitTest/

  signed-verification-apk:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build signed verification APK
        shell: bash
        env:
          EARA_RELEASE_JKS_BASE64: ${{ secrets.EARA_RELEASE_JKS_BASE64 }}
          EARA_RELEASE_STORE_FILE: eara-release.jks
          EARA_RELEASE_STORE_PASSWORD: ${{ secrets.EARA_RELEASE_STORE_PASSWORD }}
          EARA_RELEASE_KEY_ALIAS: ${{ secrets.EARA_RELEASE_KEY_ALIAS }}
          EARA_RELEASE_KEY_PASSWORD: ${{ secrets.EARA_RELEASE_KEY_PASSWORD }}
          VERIFICATION_VARIANT: ${{ inputs.verification_variant || 'release' }}
        run: |
          set -euo pipefail
          test -n "$EARA_RELEASE_JKS_BASE64"
          test -n "$EARA_RELEASE_STORE_PASSWORD"
          test -n "$EARA_RELEASE_KEY_ALIAS"
          test -n "$EARA_RELEASE_KEY_PASSWORD"
          trap 'rm -f eara-release.jks' EXIT
          printf '%s' "$EARA_RELEASE_JKS_BASE64" | base64 --decode > eara-release.jks
          chmod 600 eara-release.jks
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          case "$VERIFICATION_VARIANT" in
            release) ./gradlew :app:assembleRelease ;;
            benchmark) ./gradlew :app:assembleBenchmark ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ inputs.verification_variant || 'release' }}-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .build_asmr_player_android/app/outputs/apk/*/*.apk
            .build_asmr_player_android/app/outputs/mapping/*/mapping.txt
