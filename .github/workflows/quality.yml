name: Quality

on:
  workflow_dispatch:
    inputs:
      signed_apk:
        description: Build a signed Release APK for device verification
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - "release/**"
      - "update/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Run release unit tests
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-unit-test-reports
          include-hidden-files: true
          path: |
            .build_asmr_player_android/app/reports/tests/testReleaseUnitTest/
            .build_asmr_player_android/app/test-results/testReleaseUnitTest/

      - name: Build signed verification APK
        if: github.event_name == 'workflow_dispatch' && inputs.signed_apk
        shell: bash
        env:
          EARA_RELEASE_JKS_BASE64: ${{ secrets.EARA_RELEASE_JKS_BASE64 }}
          EARA_RELEASE_STORE_FILE: eara-release.jks
          EARA_RELEASE_STORE_PASSWORD: ${{ secrets.EARA_RELEASE_STORE_PASSWORD }}
          EARA_RELEASE_KEY_ALIAS: ${{ secrets.EARA_RELEASE_KEY_ALIAS }}
          EARA_RELEASE_KEY_PASSWORD: ${{ secrets.EARA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$EARA_RELEASE_JKS_BASE64"
          test -n "$EARA_RELEASE_STORE_PASSWORD"
          test -n "$EARA_RELEASE_KEY_ALIAS"
          test -n "$EARA_RELEASE_KEY_PASSWORD"
          trap 'rm -f eara-release.jks' EXIT
          printf '%s' "$EARA_RELEASE_JKS_BASE64" | base64 --decode > eara-release.jks
          chmod 600 eara-release.jks
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.signed_apk
        with:
          name: signed-release-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .build_asmr_player_android/app/outputs/apk/release/*.apk
            .build_asmr_player_android/app/outputs/mapping/release/mapping.txt
